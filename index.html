<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Economy & Population Map</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f8f9fa;
            --panel: #ffffff;
            --text: #2c3e50;
            --muted: #6b7b88;
            --tile: #dbe6ee;
            --tile-border: #ffffff;
            --tile-hover: #3498db;
            --tile-hover-border: #21618c;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        h1 {
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--muted);
            margin-bottom: 30px;
            text-align: center;
            max-width: 720px;
        }

        #map-container {
            width: 100%;
            max-width: 1100px;
            background: var(--panel);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .legend {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
            flex-wrap: wrap;
        }

        .legend-swatch {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background: var(--tile);
            border: 1px solid #c3d0da;
        }

        .tile-map-wrapper {
            overflow-x: auto;
        }

        .tile-map {
            position: relative;
            min-width: 920px;
            width: 100%;
            aspect-ratio: 12 / 8;
            background:
                linear-gradient(180deg, rgba(52, 152, 219, 0.06), rgba(52, 152, 219, 0)),
                linear-gradient(90deg, rgba(44, 62, 80, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(44, 62, 80, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, calc(100% / 12) calc(100% / 8), calc(100% / 12) calc(100% / 8);
            border-radius: 10px;
            padding: 10px;
        }

        .state-tile {
            position: absolute;
            width: calc((100% - 20px) / 12 - 8px);
            height: calc((100% - 20px) / 8 - 8px);
            border: none;
            border-radius: 10px;
            background: var(--tile);
            color: var(--text);
            box-shadow: 0 3px 10px rgba(44, 62, 80, 0.08);
            border: 2px solid var(--tile-border);
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            text-align: center;
        }

        .state-tile:hover,
        .state-tile:focus-visible,
        .state-tile.active {
            background: var(--tile-hover);
            border-color: var(--tile-hover-border);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.28);
            color: #ffffff;
            transform: translateY(-2px);
            outline: none;
            z-index: 2;
        }

        .state-code {
            font-size: clamp(0.9rem, 1.5vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .state-name {
            font-size: clamp(0.62rem, 1vw, 0.78rem);
            margin-top: 4px;
            line-height: 1.2;
        }

        #tooltip {
            position: fixed;
            text-align: left;
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            color: var(--text);
            min-width: 240px;
            z-index: 10;
            transform: translate(14px, -50%);
            transition: opacity 0.15s ease;
        }

        #tooltip h3 {
            margin: 0 0 10px 0;
            color: #2980b9;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 5px;
        }

        .info-row {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .label {
            font-weight: 600;
            color: #34495e;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            #map-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <h1>United States Economic Map</h1>
    <p class="subtitle">Explore a self-contained U.S. tile map that works without downloading remote map files. Hover or focus a state to view its population and top economic drivers.</p>

            <span class="legend-swatch" aria-hidden="true"></span>

        <div class="tile-map-wrapper">
            <div id="tile-map" class="tile-map" aria-label="United States economic tile map" role="img"></div>

        const tileLayout = [
            { name: "Alaska", row: 6, col: 0 },

            { name: "Mississippi", row: 4, col: 6 },
            { name: "Alabama", row: 4, col: 7 },
            { name: "Georgia", row: 4, col: 8 },
            { name: "North Carolina", row: 4, col: 9 },
            { name: "South Carolina", row: 5, col: 8 },
            { name: "Florida", row: 6, col: 9 },
            { name: "New Jersey", row: 4, col: 10 },
            { name: "Delaware", row: 4, col: 11 },
            { name: "Rhode Island", row: 5, col: 11 },
            { name: "District of Columbia", row: 5, col: 10 },
            { name: "Puerto Rico", row: 7, col: 10 }
        ];

        const tileMap = document.getElementById("tile-map");
        const tooltip = document.getElementById("tooltip");
        const columns = 12;
        const rows = 8;

        function showTooltip(event, stateName, tile) {
            const data = stateData[stateName];
            tooltip.innerHTML = `
                <h3>${stateName}</h3>
                <div class="info-row"><span class="label">Population:</span> ${data.pop}</div>
                <div class="info-row"><span class="label">Top Industries:</span> ${data.drivers}</div>
            `;
            tooltip.style.opacity = 1;
            tooltip.style.left = `${Math.min(event.clientX + 14, window.innerWidth - 260)}px`;
            tooltip.style.top = `${Math.max(event.clientY, 120)}px`;
            document.querySelectorAll('.state-tile.active').forEach((node) => node.classList.remove('active'));
            tile.classList.add('active');
        }

        function hideTooltip(tile) {
            tooltip.style.opacity = 0;
            tile.classList.remove('active');
        }

        tileLayout.forEach(({ name, row, col }) => {
            const data = stateData[name];
            if (!data) return;

            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "state-tile";
            tile.style.left = `calc(${(col / columns) * 100}% + 4px)`;
            tile.style.top = `calc(${(row / rows) * 100}% + 4px)`;
            tile.setAttribute("aria-label", `${name}. Population ${data.pop}. Top industries ${data.drivers}.`);
            tile.innerHTML = `
                <span class="state-code">${data.code}</span>
                <span class="state-name">${name}</span>
            `;

            tile.addEventListener("mouseenter", (event) => showTooltip(event, name, tile));
            tile.addEventListener("mousemove", (event) => showTooltip(event, name, tile));
            tile.addEventListener("focus", (event) => showTooltip(event, name, tile));
            tile.addEventListener("blur", () => hideTooltip(tile));
            tile.addEventListener("mouseleave", () => hideTooltip(tile));

            tileMap.appendChild(tile);
        });
    </script>
</body>
</html>
