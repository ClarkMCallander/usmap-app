<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Economy & Population Map</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f8f9fa;
            --card: #ffffff;
            --ink: #243447;
            --muted: #6b7a89;
            --stroke: #dbe4ec;
            --accent: #1d6fdc;
            --accent-dark: #0f4fa7;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink);
        }

        h1 {
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--muted);
            margin: 0 0 24px;
            text-align: center;
        }

        #map-container {
            width: 100%;
            max-width: 1100px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 18px;
        }

        .legend-gradient {
            width: 180px;
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(90deg, #dceeff, #7fb9ff, #1d6fdc);
            border: 1px solid var(--stroke);
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .state-tile {
            fill: var(--tile-fill, #9cc7ff);
            stroke: #ffffff;
            stroke-width: 2;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease, stroke-width 0.15s ease;
            transform-origin: center;
        }

        .state-group:hover .state-tile,
        .state-group:focus-visible .state-tile,
        .state-group.active .state-tile {
            filter: brightness(0.94);
            transform: translateY(-3px);
            stroke-width: 3;
        }

        .state-label,
        .state-value {
            text-anchor: middle;
            pointer-events: none;
            fill: #0b2239;
        }

        .state-label {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .state-value {
            font-size: 11px;
            opacity: 0.78;
        }

        .tile-note {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-top: 12px;
        }

        #tooltip {
            position: fixed;
            text-align: left;
            padding: 14px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid var(--stroke);
            border-radius: 10px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
            color: var(--ink);
            min-width: 220px;
            z-index: 20;
            transform: translate(-50%, calc(-100% - 14px));
            transition: opacity 0.15s ease;
        }

        #tooltip.visible {
            opacity: 1;
        }

        #tooltip h3 {
            margin: 0 0 10px 0;
            color: var(--accent-dark);
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 6px;
            font-size: 16px;
        }

        .info-row {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .label {
            font-weight: 600;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            #map-container {
                padding: 14px;
            }

            .state-label {
                font-size: 12px;
            }

            .state-value {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <h1>United States Economic Map</h1>
    <p class="subtitle">Hover over a state to view its population and top economic drivers.</p>

    <div id="map-container">
        <div class="legend">
            <span>Population</span>
            <div class="legend-gradient" aria-hidden="true"></div>
            <span>Lower</span>
            <span>→</span>
            <span>Higher</span>
        </div>
        <svg id="map" viewBox="0 0 980 640" preserveAspectRatio="xMidYMid meet" aria-label="United States tile map"></svg>
        <p class="tile-note">This tile map is fully bundled with the page, so it keeps working even when third-party map downloads fail.</p>
    </div>

    <div id="tooltip" role="status" aria-live="polite"></div>

    <script>
        const stateData = {

            "North Carolina": { pop: "10.8 Million", popValue: 10.8, drivers: "Technology, Finance, Manufacturing", abbr: "NC" },
            "North Dakota": { pop: "783,000", popValue: 0.783, drivers: "Oil & Gas, Agriculture, Technology", abbr: "ND" },
            "Ohio": { pop: "11.8 Million", popValue: 11.8, drivers: "Manufacturing, Healthcare, Finance", abbr: "OH" },

            "Rhode Island": { pop: "1.1 Million", popValue: 1.1, drivers: "Healthcare, Tourism, Manufacturing", abbr: "RI" },
            "South Carolina": { pop: "5.3 Million", popValue: 5.3, drivers: "Automotive, Tourism, Agriculture", abbr: "SC" },
            "South Dakota": { pop: "919,000", popValue: 0.919, drivers: "Agriculture, Finance, Tourism", abbr: "SD" },
            "Tennessee": { pop: "7.1 Million", popValue: 7.1, drivers: "Healthcare, Automotive, Entertainment", abbr: "TN" },
            "Texas": { pop: "30.5 Million", popValue: 30.5, drivers: "Energy, Technology, Manufacturing", abbr: "TX" },
            "Utah": { pop: "3.4 Million", popValue: 3.4, drivers: "Technology, Tourism, Mining", abbr: "UT" },
            "Vermont": { pop: "647,000", popValue: 0.647, drivers: "Tourism, Agriculture, Manufacturing", abbr: "VT" },
            "Virginia": { pop: "8.7 Million", popValue: 8.7, drivers: "Defense, Technology, Agriculture", abbr: "VA" },
            "Washington": { pop: "7.8 Million", popValue: 7.8, drivers: "Technology, Aerospace, Agriculture", abbr: "WA" },

            "Wyoming": { pop: "584,000", popValue: 0.584, drivers: "Mining, Tourism, Agriculture", abbr: "WY" }
        };

        const tileLayout = [
            { name: 'Alaska', col: 0, row: 6 },
            { name: 'Hawaii', col: 1, row: 7 },
            { name: 'Washington', col: 1, row: 1 },
            { name: 'Oregon', col: 1, row: 2 },
            { name: 'California', col: 1, row: 3 },
            { name: 'Idaho', col: 2, row: 1 },
            { name: 'Nevada', col: 2, row: 2 },
            { name: 'Utah', col: 3, row: 2 },
            { name: 'Arizona', col: 2, row: 3 },
            { name: 'Montana', col: 3, row: 1 },
            { name: 'Wyoming', col: 4, row: 1 },
            { name: 'Colorado', col: 4, row: 2 },
            { name: 'New Mexico', col: 4, row: 3 },
            { name: 'North Dakota', col: 5, row: 1 },
            { name: 'South Dakota', col: 5, row: 2 },
            { name: 'Nebraska', col: 5, row: 3 },
            { name: 'Kansas', col: 5, row: 4 },
            { name: 'Oklahoma', col: 5, row: 5 },
            { name: 'Texas', col: 5, row: 6 },
            { name: 'Minnesota', col: 6, row: 1 },
            { name: 'Iowa', col: 6, row: 3 },
            { name: 'Missouri', col: 6, row: 4 },
            { name: 'Arkansas', col: 6, row: 5 },
            { name: 'Louisiana', col: 6, row: 6 },
            { name: 'Wisconsin', col: 7, row: 1 },
            { name: 'Illinois', col: 7, row: 3 },
            { name: 'Kentucky', col: 8, row: 4 },
            { name: 'Tennessee', col: 8, row: 5 },
            { name: 'Mississippi', col: 7, row: 6 },
            { name: 'Michigan', col: 8, row: 2 },
            { name: 'Indiana', col: 8, row: 3 },
            { name: 'Alabama', col: 8, row: 6 },
            { name: 'Ohio', col: 9, row: 3 },
            { name: 'West Virginia', col: 10, row: 4 },
            { name: 'Georgia', col: 9, row: 6 },
            { name: 'Florida', col: 10, row: 7 },
            { name: 'Pennsylvania', col: 10, row: 3 },
            { name: 'Virginia', col: 11, row: 4 },
            { name: 'North Carolina', col: 11, row: 5 },
            { name: 'South Carolina', col: 10, row: 6 },
            { name: 'New York', col: 11, row: 2 },
            { name: 'New Jersey', col: 12, row: 3 },
            { name: 'Maryland', col: 12, row: 4 },
            { name: 'Delaware', col: 13, row: 4 },
            { name: 'District of Columbia', col: 13, row: 5 },
            { name: 'Vermont', col: 12, row: 1 },
            { name: 'New Hampshire', col: 13, row: 1 },
            { name: 'Maine', col: 14, row: 1 },
            { name: 'Massachusetts', col: 13, row: 2 },
            { name: 'Connecticut', col: 13, row: 3 },
            { name: 'Rhode Island', col: 14, row: 3 }
        ];

        const svg = document.getElementById('map');
        const tooltip = document.getElementById('tooltip');
        const tileWidth = 56;
        const tileHeight = 56;
        const gap = 8;
        const offsetX = 36;
        const offsetY = 30;
        const maxPop = Math.max(...Object.values(stateData).map((state) => state.popValue));

        function populationColor(value) {
            const ratio = value / maxPop;
            const lightness = 92 - ratio * 42;
            return `hsl(210 85% ${lightness}%)`;
        }

        function updateTooltip(event, name, data) {
            tooltip.innerHTML = `
                <h3>${name}</h3>
                <div class="info-row"><span class="label">Population:</span> ${data.pop}</div>
                <div class="info-row"><span class="label">Top Industries:</span> ${data.drivers}</div>
            `;
            tooltip.classList.add('visible');
            tooltip.style.left = `${event.clientX}px`;
            tooltip.style.top = `${event.clientY}px`;
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        tileLayout.forEach(({ name, col, row }) => {
            const data = stateData[name];
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const abbr = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const pop = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const x = offsetX + col * (tileWidth + gap);
            const y = offsetY + row * (tileHeight + gap);

            group.setAttribute('class', 'state-group');
            group.setAttribute('tabindex', '0');
            group.setAttribute('role', 'img');
            group.setAttribute('aria-label', `${name}. Population ${data.pop}. Top industries: ${data.drivers}.`);

            rect.setAttribute('class', 'state-tile');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('rx', 14);
            rect.setAttribute('ry', 14);
            rect.setAttribute('width', tileWidth);
            rect.setAttribute('height', tileHeight);
            rect.style.setProperty('--tile-fill', populationColor(data.popValue));

            abbr.setAttribute('class', 'state-label');
            abbr.setAttribute('x', x + tileWidth / 2);
            abbr.setAttribute('y', y + 24);
            abbr.textContent = data.abbr;

            pop.setAttribute('class', 'state-value');
            pop.setAttribute('x', x + tileWidth / 2);
            pop.setAttribute('y', y + 40);
            pop.textContent = data.popValue >= 10 ? `${data.popValue.toFixed(0)}M` : `${data.popValue.toFixed(1)}M`;

            const show = (event) => {
                group.classList.add('active');
                updateTooltip(event, name, data);
            };

            const move = (event) => updateTooltip(event, name, data);
            const hide = () => {
                group.classList.remove('active');
                hideTooltip();
            };

            group.addEventListener('pointerenter', show);
            group.addEventListener('pointermove', move);
            group.addEventListener('pointerleave', hide);
            group.addEventListener('focus', (event) => show({ clientX: window.innerWidth / 2, clientY: event.target.getBoundingClientRect().top }));
            group.addEventListener('blur', hide);
            group.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    hide();
                    group.blur();
                }
            });

            group.append(rect, abbr, pop);
            svg.appendChild(group);
        });
    </script>
</body>
</html>
